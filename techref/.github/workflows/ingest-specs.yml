name: Ingest Open-Source Specs & Docs

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target GitHub repository (owner/repo)'
        required: false
        default: 'fastapi/fastapi'
      spec_url:
        description: 'Direct OpenAPI spec URL'
        required: false
        default: 'https://petstore.swagger.io/v2/swagger.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Ingestion Dependencies
        run: npm install @apidevtools/swagger-parser

      - name: Execute Normalization Engine
        run: node scripts/ingest-specs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_SPEC_URL: ${{ github.event.inputs.spec_url }}

      - name: Validate Generated Types & AST
        run: npx tsc --noEmit

      - name: Commit & Create Pull Request If Changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): ingest latest upstream open-source specs & guides'
          title: 'Automated Ingestion: Upstream Specs & Docs Update'
          body: |
            Automated sync from upstream open-source repositories.
            - Validated OpenAPI 3.0/Swagger JSON
            - Rebuilt search indexing records
            - Regenerated code snippet test fixtures
          branch: automated-spec-sync
          base: main
          delete-branch: true
