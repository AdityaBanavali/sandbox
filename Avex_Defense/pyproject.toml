[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-threat-detection"
version = "0.1.0"
description = "AI-Based Detection of Cyber Threats in Unidirectional IP Traffic (Cyber Defense Enclave)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cyber Defense Team" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "SQLAlchemy>=2.0.28,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "celery>=5.3.6,<6.0.0",
    "redis>=5.0.3,<6.0.0",
    "cryptography>=42.0.5,<43.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "shap>=0.45.0",
    "dpkt>=1.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
